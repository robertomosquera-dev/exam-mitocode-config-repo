server:
  port: ${GATEWAY_PORT:8080}

gateway:
  downstream:
    movie-uri: ${GATEWAY_MOVIE_URI:http://localhost:51100}
    booking-uri: ${GATEWAY_BOOKING_URI:http://localhost:51200}
    auth-uri: ${GATEWAY_AUTH_URI:http://localhost:50003}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_JWT_ISSUER:http://localhost:50003}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:50003/oauth2/jwks}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${gateway.downstream.auth-uri}
              predicates:
                - Path=/api/v1/auth/**,/oauth2/jwks
            - id: movie-service
              uri: ${gateway.downstream.movie-uri}
              predicates:
                - Path=/api/v1/movies/**,/api/v1/screenings/**
            - id: booking-service
              uri: ${gateway.downstream.booking-uri}
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**
            - id: auth-docs
              uri: ${gateway.downstream.auth-uri}
              predicates:
                - Path=/auth-service/v3/api-docs/**
              filters:
                - RewritePath=/auth-service/(?<path>.*), /$\{path}
            - id: movie-docs
              uri: ${gateway.downstream.movie-uri}
              predicates:
                - Path=/movie-service/v3/api-docs/**
              filters:
                - RewritePath=/movie-service/(?<path>.*), /$\{path}
            - id: booking-docs
              uri: ${gateway.downstream.booking-uri}
              predicates:
                - Path=/booking-service/v3/api-docs/**
              filters:
                - RewritePath=/booking-service/(?<path>.*), /$\{path}

springdoc:
  swagger-ui:
    path: /swagger
    persistAuthorization: true
    urls:
      - name: Auth Service API
        url: /auth-service/v3/api-docs
        displayName: Auth Service
      - name: Movie Service API
        url: /movie-service/v3/api-docs
        displayName: Movie Service
      - name: Booking Service API
        url: /booking-service/v3/api-docs
        displayName: Booking Service
  api-docs:
    enabled: true
