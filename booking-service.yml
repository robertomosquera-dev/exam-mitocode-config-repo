server:
  port: ${BOOKING_PORT:51200}

spring:
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/bookingdb}
    username: ${BOOKING_DB_USERNAME:root}
    password: ${BOOKING_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
  cloud:
    loadbalancer:
      retry:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            movie-service:
              - uri: ${MOVIE_SERVICE_INSTANCE_URL:http://localhost:51100}

movie-service:
  base-url: http://movie-service/api/v1

booking:
  recovery:
    initial-delay-ms: ${BOOKING_RECOVERY_INITIAL_DELAY_MS:60000}
    interval-ms: ${BOOKING_RECOVERY_INTERVAL_MS:60000}
    stale-after-ms: ${BOOKING_RECOVERY_STALE_AFTER_MS:600000}

resilience4j:
  retry:
    instances:
      movieReserve:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - com.mitocode.application.error.MovieServiceException
