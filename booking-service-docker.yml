spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:50003/oauth2/jwks}
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
  cloud:
    discovery:
      client:
        simple:
          instances:
            movie-service:
              - uri: ${MOVIE_SERVICE_INSTANCE_URL:http://movie-service:51100}
