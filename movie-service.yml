server:
  port: ${MOVIE_PORT:51100}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_JWT_ISSUER:http://localhost:50003}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:50003/oauth2/jwks}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    database: postgresql
  datasource:
    url: ${MOVIE_DB_URL:jdbc:postgresql://localhost:5432/moviedb}
    username: ${MOVIE_DB_USERNAME:root}
    password: ${MOVIE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

springdoc:
  swagger-ui:
    path: /api/v1/swagger-ui.html
